packages:
  - "apps/*"
  - "packages/*"

# pnpm reads allowBuilds as {packagePattern: boolean} and switches strictly on
# true/false. It was previously written as an index map ('0': esbuild), whose
# values are strings, so both entries matched neither case and were dropped --
# the key resolved to an empty onlyBuiltDependencies and did nothing.
# It is still inert today because .npmrc sets ignore-scripts=true, which
# disables dependency lifecycle scripts outright; esbuild and @biomejs/biome
# both work without their postinstall because each resolves its platform binary
# from an optional dependency. Kept in the parsed form so the allowlist is
# correct if ignore-scripts is ever relaxed.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

blockExoticSubdeps: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hejmly/*"

overrides:
  # Every override is scoped to ONE parent, so it can only ever lift the leaf it
  # names. A bare "esbuild: >=0.25.0" would additionally rewrite esbuild for every
  # other consumer in the tree, which is a silent blast radius nobody reviews.
  # Scope, never global.

  # @esbuild-kit/core-utils (deprecated, via drizzle-kit > @esbuild-kit/esm-loader)
  # hard-pins esbuild ~0.18.20, which carries the dev-server SSRF. drizzle-kit
  # itself already declares ^0.25.4, so only this leaf needs lifting.
  # Remove once drizzle-kit drops the @esbuild-kit chain.
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

  # The three below are open advisories with no upgrade path: vite-plugin-pwa 1.3.0
  # and @modelcontextprotocol/sdk 1.30.0 are both already the latest release, so the
  # vulnerable packages can only be lifted at the leaf. Each fix version is younger
  # than the 30-day cooldown we apply to routine bumps; a patch for an OPEN advisory
  # is the standing exception to that, the same call taken for better-auth 1.7.2.
  # Drop each one once its parent ships a range that already excludes the bad
  # versions.

  # browserslist <=4.28.6 has an unbounded cache (OOM) and a prototype write via
  # untrusted browserslist-stats.json. Build-time only, through
  # vite-plugin-pwa > workbox-build. Two separate parents pull it in, and scoping
  # means both have to be named: lifting only one leaves the other on 4.28.2.
  "@babel/helper-compilation-targets>browserslist": ">=4.28.7"
  "core-js-compat>browserslist": ">=4.28.7"

  # fast-uri <3.1.6 has an SSRF via malformed IPv6 normalisation and host confusion
  # via skipped IDN canonicalisation. Reached through workbox-build > ajv at build
  # time. Pinned exactly rather than as a range: 3.1.7 was published today and would
  # be refused by minimumReleaseAge, and 4.x is a major this chain has not adopted.
  "ajv>fast-uri": "3.1.6"

  # qs <6.16.0 has an array-limit bypass via bracket-key comma parsing and two DoS
  # paths in parse/stringify. Reached through @modelcontextprotocol/sdk > express.
  # The SDK uses its own Web-standard transport here rather than express, but the
  # dependency is installed, so the advisory is still reported against this tree.
  "express>qs": ">=6.16.0"

# better-call's OpenAPIParameter declares `schema.items`, `schema.enum` and
# `schema.minLength` as optional WITHOUT `| undefined`, while the sibling
# `format`/`description`/`default`/`example` in the same object do include it.
# @better-auth/oauth-provider's /oauth2/authorize endpoint metadata is a union
# whose members carry `items?: undefined`, so under our tsconfig's
# `exactOptionalPropertyTypes` the plugin stops being assignable to
# BetterAuthPlugin and `createAuth` fails to compile. The patch adds the missing
# `| undefined` to those three properties -- strictly widening, and consistent
# with how the same object already types its other optional fields.
# better-call 1.4.0 is `latest` and @better-auth/oauth-provider peer-pins it
# exactly, so there is no version to upgrade to. Drop this the moment upstream
# ships the fix; a better-call bump makes the patch fail loudly rather than
# silently rot.
patchedDependencies:
  better-call@1.4.0: patches/better-call@1.4.0.patch

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '0': esbuild
  '1': '@biomejs/biome'
blockExoticSubdeps: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hejmly/*"

auditConfig:
  # GHSA-p2fr-6hmx-4528 (@better-auth/oauth-provider): a token request that omits
  # the `resource` parameter is minted with the plugin's whole `validAudiences`
  # list as its audience instead of being bound to one resource, so a token can be
  # replayed against a resource it was never requested for. Exploiting it needs a
  # SECOND valid audience to replay into; `createAuth` configures exactly one
  # (`validAudiences: [mcpResource]`), so an unbound token is already identical to
  # a correctly bound one. Requests that DO send `resource` are validated and
  # rejected when unknown -- that path was never affected.
  # Not fixable by upgrade: the patch ships only in 1.7.0-beta.4+, and
  # @better-auth/oauth-provider@1.7.0-rc.2 peer-requires better-auth ^1.7.0-rc.2,
  # so taking it means moving the whole auth stack onto a prerelease.
  # DELETE THIS the moment 1.7.0 is stable, or the moment a second entry is added
  # to validAudiences -- that is what makes this exploitable.
  ignoreGhsas:
    - GHSA-p2fr-6hmx-4528

overrides:
  # Every override is scoped to ONE parent. A bare "esbuild: >=0.25.0" here would
  # replace vite's own ^0.25.0 rather than narrow it, floating vite to 0.28.x and
  # breaking `pnpm build` with "Transforming destructuring to the configured target
  # environment is not supported yet". Scope, never global.

  # @esbuild-kit/core-utils (deprecated, via drizzle-kit > @esbuild-kit/esm-loader)
  # hard-pins esbuild ~0.18.20, which carries the dev-server SSRF. drizzle-kit
  # itself already declares ^0.25.4, so only this leaf needs lifting.
  # Remove once drizzle-kit drops the @esbuild-kit chain.
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

  # GHSA-mh99-v99m-4gvg: no brace-expansion 2.x release satisfies it, and the whole
  # chain above it (vite-plugin-pwa > workbox-build >
  # @trickfilm400/rollup-plugin-off-main-thread > ejs > jake > filelist) is already
  # at its newest published version, so there is no bump available.
  # Overriding brace-expansion directly does NOT work: minimatch@5 requires it and
  # calls the result, but 5.x exports {expand, ...} rather than a bare function --
  # that typechecks and breaks the service-worker build at runtime. filelist calls
  # `minimatch.match(...)`, a property minimatch 10 still exports, so lifting
  # minimatch instead pulls brace-expansion 5 and drops the 2.x line entirely.
  "filelist>minimatch": "^10.2.5"

  # GHSA-frvp-7c67-39w9 (Windows-only path traversal in serve-static).
  # TEMPORARY -- delete this together with the @modelcontextprotocol/sdk 1.29.0 ->
  # 1.30.0 bump, which declares "^1.19.9 || ^2.0.5" natively and makes it redundant.
  # 1.30.0 is published but still inside our own minimumReleaseAge window, and that
  # gate is not worth weakening for this. Upstream widening to ^2.0.5 is the
  # evidence that 2.x is compatible; we additionally never reach the affected code
  # (it lives in sdk/server/streamableHttp.js, and core/server/mcp imports
  # webStandardStreamableHttp.js instead).
  "@modelcontextprotocol/sdk>@hono/node-server": "^2.0.5"

# Keep every run of consecutive comment lines inside a mapping at 32 or fewer.
# pnpm 12's YAML parser fails the whole load at 33 ("too many consecutive comments
# before resolving collection entry"), and with it every pnpm command -- install,
# audit, all of them. pnpm 11 parsed any length, so nothing older warns about it.
packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 and 12 read only auth and registry settings from .npmrc; every other
# setting has to live here or in the global config.yaml. These seven moved out of
# the repo's .npmrc, which is now gone -- it held nothing else. Silently losing
# them is the failure mode: neither version warns about a pnpm setting left in
# .npmrc, it just applies its own default, so `ignoreScripts` reverts to running
# every dependency's install hooks and `autoInstallPeers` reverts to true.
#
# pnpm 12 ships as a native binary whose published `bin/pnpm` is a placeholder its
# own preinstall script rewrites. pnpm's self-install of the `packageManager`
# version inherits `ignoreScripts: true`, so that script never runs and the
# placeholder stays. On 12.0.0-12.3.x that is fatal -- `bin/pnpm: 4: Syntax
# error: ")" unexpected` on every call (pnpm/pnpm#14346) -- so never pin below
# 12.4.0. From 12.4.0 (pnpm/pnpm#14527) the placeholder is a valid `sh` script
# that hands over to `bin/pnpm.mjs`, which spawns the `@pnpm/exe.<platform>`
# binary pnpm already installed and integrity-checked against this lockfile's
# `packageManagerDependencies`. Nothing is downloaded on that path; the cost is
# one Node startup per call. Allowing `pnpm` or `@pnpm/exe` in allowBuilds below
# does not change it -- the placeholder stays either way, so neither is listed.
# pnpm 12 also parses `--depth` as an integer, so `pnpm update --depth Infinity`
# is rejected; plain `pnpm update -r <pkg>` already re-resolves a transitive leaf.
frozenLockfile: true
preferFrozenLockfile: true
ignoreScripts: true
saveExact: true
strictPeerDependencies: true
autoInstallPeers: false
resolutionMode: highest

# pnpm reads allowBuilds as {packagePattern: boolean} and switches strictly on
# true/false. It was previously written as an index map ('0': esbuild), whose
# values are strings, so both entries matched neither case and were dropped --
# the key resolved to an empty onlyBuiltDependencies and did nothing.
# It is still inert today because ignoreScripts above disables dependency
# lifecycle scripts outright; esbuild and @biomejs/biome
# both work without their postinstall because each resolves its platform binary
# from an optional dependency. Kept in the parsed form so the allowlist is
# correct if ignoreScripts is ever relaxed.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

blockExoticSubdeps: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hejmly/*"

overrides:
  # Every override is scoped to ONE parent, so it can only ever lift the leaf it
  # names. A bare "esbuild: >=0.25.0" would additionally rewrite esbuild for every
  # other consumer in the tree, which is a silent blast radius nobody reviews.
  # Scope, never global.
  #
  # An override earns its place ONLY while the parent's own range cannot reach the
  # fix -- a hard pin, or a range that stops below it. When the parent declares a
  # caret and the fix lands as a patch or minor, the override dies the moment that
  # fix publishes, and every audit after that is re-checking a line that does
  # nothing. So each entry here has to be re-tested, not just re-read: drop it,
  # re-resolve, and see whether the advisory actually comes back.
  #
  # That test is what retired seven earlier entries.
  # "@babel/helper-compilation-targets" and "core-js-compat" (browserslist),
  # "ajv>fast-uri" and "express>qs" all named leaves under open carets, so the
  # resolver reaches the published fixes unaided; so do ajv's fast-uri ^3.0.1 and
  # express-rate-limit's ip-address ^10.2.0. The seventh,
  # "workbox-build>@trickfilm400/rollup-plugin-off-main-thread": "4.0.0", existed
  # to drop minimatch 5.1.9 (via ejs 3 > jake > filelist), but GHSA-g3hv-75wg-m249
  # now reads ">=7.0.0 <11.0.1", so 5.1.9 is outside it and the audit stays clean
  # without the override.

  # @esbuild-kit/core-utils (deprecated, via drizzle-kit > @esbuild-kit/esm-loader)
  # hard-pins esbuild ~0.18.20, which carries the dev-server SSRF. drizzle-kit
  # itself already declares ^0.25.4, so only this leaf needs lifting. This is the
  # hard-pin case, so no upstream patch release can ever retire it on its own.
  # Remove once drizzle-kit drops the @esbuild-kit chain -- 0.31.11 (installed, and
  # still `latest`) declares "@esbuild-kit/esm-loader": "^2.5.5", and
  # drizzle-kit 1.x is rc-only while the stack is locked to stable.
  # Re-tested this cycle by dropping the entry and re-resolving: esbuild 0.18.20
  # comes back (drizzle-kit is reached from the root, better-auth and the auth
  # CLI, so this is not a dev-only chain) and GHSA-67mh-4wv8-2f99 returns moderate.
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

  # workbox-build (via vite-plugin-pwa, build-time SW manifest injection) declares
  # glob ^11.0.1, which tops out at 11.1.0 -> minimatch ^10. glob <=14.0.1 carries
  # GHSA-3g3m-2fjr-6pw4 and minimatch 10 carries GHSA-g3hv-75wg-m249, and both
  # fixes exist only on new majors (glob 14.0.2, minimatch 11.0.1), so the range
  # cannot reach them. 7.4.1 is workbox-build's `latest`; there is no newer
  # release to upgrade to. workbox-build's only glob call is
  # `globSync(pattern, { cwd, follow, ignore })` in lib/get-file-details.js;
  # glob 14 keeps that signature and its CJS `require` export, and `pnpm build`
  # emits the same precache manifest. glob 14.0.2 brings minimatch ^11.0.0.
  # Re-tested this cycle by dropping the entry: glob 11.1.0 and minimatch 10.2.6
  # come back with both advisories. Remove once a workbox-build release declares
  # glob >=14.0.2.
  "workbox-build>glob": "14.0.2"


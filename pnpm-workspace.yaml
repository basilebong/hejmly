# Keep every run of consecutive comment lines inside a mapping at 32 or fewer:
# pnpm 12's YAML parser fails the whole load at 33 ("too many consecutive comments
# before resolving collection entry"), while pnpm 11 parses any length -- so an
# over-long block breaks nothing today and everything the day someone runs pnpm 12.
packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads only auth and registry settings from .npmrc; every other setting
# has to live here or in the global config.yaml. These seven moved out of the
# repo's .npmrc, which is now gone -- it held nothing else. Silently losing them
# is the failure mode: pnpm 11 does not warn about a pnpm setting left in
# .npmrc, it just applies its own default, so `ignoreScripts` reverts to running
# every dependency's install hooks and `autoInstallPeers` reverts to true.
#
# `ignoreScripts: true` is why `packageManager` is still on the pnpm 11 line, but
# only until 2026-10-08. pnpm 12 ships as a native binary whose published
# `bin/pnpm` is a placeholder its own preinstall script rewrites, and pnpm's
# self-managed install of the pinned version inherits this setting -- so on
# 12.0.0 through 12.3.4 the placeholder survives and every later `pnpm` call dies
# with `bin/pnpm: 4: Syntax error: ")" unexpected` (pnpm/pnpm#14346). Upstream
# pnpm/pnpm#14527 makes the placeholder a valid `sh` script that re-execs
# `bin/pnpm.mjs` under Node when scripts are blocked; it shipped in 12.4.0.
# Verified here: 12.3.2 still dies, 12.4.0 loads, and 12.4.2 installs this
# workspace end-to-end under `ignoreScripts: true` with no lockfile churn.
# 12.4.0 is 20.6d old, so the 30-day window -- not the setting -- is what holds
# it back now. When it ages out, also add `'@pnpm/exe': true` to allowBuilds
# (pnpm/pnpm#14926) so the native binary is used instead of the Node fallback.
frozenLockfile: true
preferFrozenLockfile: true
ignoreScripts: true
saveExact: true
strictPeerDependencies: true
autoInstallPeers: false
resolutionMode: highest

# pnpm reads allowBuilds as {packagePattern: boolean} and switches strictly on
# true/false. It was previously written as an index map ('0': esbuild), whose
# values are strings, so both entries matched neither case and were dropped --
# the key resolved to an empty onlyBuiltDependencies and did nothing.
# It is still inert today because ignoreScripts above disables dependency
# lifecycle scripts outright; esbuild and @biomejs/biome
# both work without their postinstall because each resolves its platform binary
# from an optional dependency. Kept in the parsed form so the allowlist is
# correct if ignoreScripts is ever relaxed.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

blockExoticSubdeps: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hejmly/*"

overrides:
  # Every override is scoped to ONE parent, so it can only ever lift the leaf it
  # names. A bare "esbuild: >=0.25.0" would additionally rewrite esbuild for every
  # other consumer in the tree, which is a silent blast radius nobody reviews.
  # Scope, never global.
  #
  # An override earns its place ONLY while the parent's own range cannot reach the
  # fix -- a hard pin, or a range that stops below it. When the parent declares a
  # caret and the fix lands as a patch or minor, the override dies the moment that
  # fix publishes, and every audit after that is re-checking a line that does
  # nothing. So each entry here has to be re-tested, not just re-read: drop it,
  # re-resolve, and see whether the advisory actually comes back.
  #
  # That test is what removed the other four, and again the two this cycle.
  # "@babel/helper-compilation-targets" and "core-js-compat" (browserslist),
  # "ajv>fast-uri" and "express>qs" all named leaves under open carets, so the
  # resolver reaches the published fixes unaided; so do ajv's fast-uri ^3.0.1 and
  # express-rate-limit's ip-address ^10.2.0. One override is left.

  # @esbuild-kit/core-utils (deprecated, via drizzle-kit > @esbuild-kit/esm-loader)
  # hard-pins esbuild ~0.18.20, which carries the dev-server SSRF. drizzle-kit
  # itself already declares ^0.25.4, so only this leaf needs lifting. This is the
  # hard-pin case, so no upstream patch release can ever retire it on its own.
  # Remove once drizzle-kit drops the @esbuild-kit chain -- 0.31.10 and 0.31.11
  # both still declare "@esbuild-kit/esm-loader": "^2.5.5", and drizzle-kit 1.x is
  # rc-only while the stack is locked to stable.
  # Re-tested this cycle by dropping the entry and re-resolving: esbuild 0.18.20
  # reappears on five paths -- the root drizzle-kit, better-auth's, and the auth
  # CLI's, so this is no longer a dev-only chain reachable from the root alone --
  # and GHSA-67mh-4wv8-2f99 comes back moderate.
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

# better-call's OpenAPIParameter declares `schema.items`, `schema.enum` and
# `schema.minLength` as optional WITHOUT `| undefined`, while the sibling
# `format`/`description`/`default`/`example` in the same object do include it.
# @better-auth/oauth-provider's /oauth2/authorize endpoint metadata is a union
# whose members carry `items?: undefined`, so under our tsconfig's
# `exactOptionalPropertyTypes` the plugin stops being assignable to
# BetterAuthPlugin and `createAuth` fails to compile. The patch adds the missing
# `| undefined` to those three properties -- strictly widening, and consistent
# with how the same object already types its other optional fields.
# better-call 1.4.0 is `latest` and @better-auth/oauth-provider peer-pins it
# exactly ("better-call": "1.4.0") -- in 1.7.2, and unchanged through 1.7.3,
# 1.7.4, 1.7.5 and 1.7.6 -- so there is no version to upgrade to, and no better-auth
# bump inside or outside the cooldown window would retire this patch. The
# registry does carry a 2.0.6 under a `release-2.0` dist-tag, but it is not
# `latest` and the exact peer pin makes it unreachable -- it is not an upgrade
# path, do not reach for it. Drop this the moment upstream ships the fix; a
# better-call bump makes the patch fail loudly rather than silently rot.
# Re-verified this cycle by removing the patch and running `tsc -b --force`:
# still fails with `schema.items` -- `Type 'undefined' is not assignable`.
# Note the --force: a plain `tsc -b` reuses .tsbuildinfo and passes anyway.
patchedDependencies:
  better-call@1.4.0: patches/better-call@1.4.0.patch
